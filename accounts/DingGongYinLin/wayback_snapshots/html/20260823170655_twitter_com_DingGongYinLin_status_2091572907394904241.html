  <div class="tweet-content">
  成长后看这个世界，入眼更多的都是灰色，城市间虽也有鲜艳的色彩与光芒，但大多数都是商铺招牌与電虹广告罢了。翠绿欲滴的树荫，带着活泼笑意的晚风，渐渐感觉不到。翻开陈旧的漫画书，把动画碟播放，只有这里面的世界没有变，时间没有流动，屏幕里主角笑的纯粹，与伙伴们旅行在奇异未知的大地上。依稀可见，屏幕外，那对在电视前过家家的父子身影。
  <br/>
  摘自《东京声士》第二章喵
